[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azet-guard"
version = "0.1.0"
description = "Runtime guardrails for AI coding agents: blocks dangerous commands, keeps secrets out of the model, and catches unverified 'tests pass' claims. Claude Code hooks, no dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "AZET", email = "hello@azet.io" }]
keywords = ["claude-code", "ai-agents", "security", "guardrails", "hooks", "secrets"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://azet.io"
Repository = "https://github.com/azet-llc/azet-guard"

[project.scripts]
azet-guard = "azet_guard.cli:main"

[tool.setuptools]
packages = ["azet_guard"]
